name: 🔧 Tech task
description: Cleanup, refactoring, infrastructure, tech debt, dependency upgrades
title: "[Tech] "
type: Task
projects: ["StrideMatch/2"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Never paste secrets** (passwords, tokens, keys, `.env` files) in an issue: only say *where* they are.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this task? What is the current problem?
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: To do
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      placeholder: "e.g. CI passes, docs are updated, branch is deleted"

  - type: checkboxes
    id: risks
    attributes:
      label: Risks
      options:
        - label: Touches production (deployment, database migration, AWS/Amplify config)
        - label: Changes an API used by other repos (front-ends, mobile app, MCP)
        - label: Needs coordination with someone else
