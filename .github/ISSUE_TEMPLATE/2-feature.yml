name: ✨ Feature
description: A new feature or a product improvement
title: "[Feature] "
type: Feature
labels: ["enhancement"]
projects: ["StrideMatch/2"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem or need?
      description: For whom (runner, store, admin…) and why it matters.
      placeholder: "As a store manager, I want … so that …"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you have in mind. Mockups or Figma links welcome.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it's done?
      placeholder: |
        - [ ] …
        - [ ] …

  - type: textarea
    id: notes
    attributes:
      label: Context, constraints, links
