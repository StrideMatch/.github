name: 🐛 Bug
description: Something doesn't work as expected
title: "[Bug] "
type: Bug
labels: ["bug"]
projects: ["StrideMatch/2"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this bug. The more precise it is, the faster it gets fixed.
        ⚠️ **Never paste passwords, tokens, API keys or customer data** in an issue.
        For a security vulnerability, contact the tech team directly instead of opening an issue.

  - type: textarea
    id: description
    attributes:
      label: What happens?
      description: Describe the problem in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click on …
        3. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging
        - Local
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / browser
      placeholder: "e.g. iPad Safari 18, Chrome 131 macOS, iPhone app 1.4.2"

  - type: input
    id: url
    attributes:
      label: URL or screen
      placeholder: "e.g. https://lab.stridematch.io/admin"

  - type: textarea
    id: logs
    attributes:
      label: Screenshots, logs, error messages
      description: Drop images here. Remove any sensitive data from logs.

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocking (nobody can use the feature)
        - Annoying (a workaround exists)
        - Minor (cosmetic)
    validations:
      required: true
