name: 🐛 Bug
description: Quelque chose ne marche pas comme prévu
title: "[Bug] "
type: Bug
labels: ["bug"]
projects: ["StrideMatch/2"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de remonter ce bug. Plus c'est précis, plus c'est rapide à corriger.
        ⚠️ **Ne colle jamais de mot de passe, token, clé API ou donnée client** dans une issue.
        Pour une faille de sécurité, préviens directement l'équipe tech au lieu d'ouvrir une issue.

  - type: textarea
    id: description
    attributes:
      label: Que se passe-t-il ?
      description: Décris le problème en une ou deux phrases.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur …
        2. Cliquer sur …
        3. Voir l'erreur
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environnement
      options:
        - Production
        - Staging
        - Local
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Appareil / navigateur
      placeholder: "ex. iPad Safari 18, Chrome 131 macOS, iPhone app 1.4.2"

  - type: input
    id: url
    attributes:
      label: URL ou écran concerné
      placeholder: "ex. https://lab.stridematch.io/admin"

  - type: textarea
    id: logs
    attributes:
      label: Captures d'écran, logs, messages d'erreur
      description: Glisse des images ici. Pour les logs, retire toute donnée sensible.

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Bloquant (personne ne peut utiliser la fonctionnalité)
        - Gênant (un contournement existe)
        - Mineur (cosmétique)
    validations:
      required: true
